services:
  akari:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akari
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    environment:
      - HTTP_PORT=8096
      - UDP_PORT=7359
      - SERVER_NAME=Akari Media
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=
      - DATA_DIR=/data
      - DANDAN_HOST=https://api.dandanplay.net
    volumes:
      - ./data:/data
